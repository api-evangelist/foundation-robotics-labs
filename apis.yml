aid: foundation-robotics-labs
name: Foundation Robotics Labs
description: >-
  Foundation Robotics Labs — trading publicly as Foundation and incorporated as
  Foundation Future Industries, Inc. — is a San Francisco humanoid robotics
  company founded in April 2024 by Sankaet Pathak, Arjun Sethi and Mike LeBlanc.
  It builds Phantom, a general-purpose humanoid robot aimed at industrial
  automation, logistics, inspection, disaster response and defense, and Cortex,
  the company's self-described physics foundation model built on Deep
  Variational Bayes Filters that pairs physics-informed prediction with
  vision-language reasoning to drive the robot. The company's published master
  plan runs from building humanoids through fleet coherence and on to building
  cities, and it states explicitly that it designs for military environments,
  unlike U.S. competitors committed to non-weaponization. Foundation has raised
  a reported $111M and is traded on the secondary market via Forge Global. As of
  this profile Foundation publishes NO public developer surface — no developer
  portal, documentation, API reference, OpenAPI/AsyncAPI definition, SDK,
  package, MCP server or agent card. Its entire public web presence is a
  five-page Framer marketing site (home, Phantom, Cortex, master plan, culture,
  careers) with no /docs, /developers, /api, /pricing, /terms or /privacy paths
  and no llms.txt. Its GitHub organization (github.com/foundationbot, verified
  first-party by @foundation.bot commit-author domains) holds internal test
  benches and forks of open-source robotics tooling — Drake, jetson-containers,
  Kalibr, PlotJuggler, Fast-DDS, an EtherCAT master, actuator dyno benches and
  NXP S32K MCU demos — and contains no API specification of any kind.
